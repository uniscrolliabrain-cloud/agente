# fly.toml app configuration file generated for agente-eb4t4a on 2026-10-29T12:38:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agente-eb4t4a'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  AGENT_BACKEND = 'model'
  ALLOWED_ORIGINS = 'https://www.agntiapro.com'
  BACKUP_INTERVAL_HOURS = '24'
  BACKUP_RETENTION_DAYS = '7'
  COMPUTER_ENABLED = 'false'
  DATA_DIR = '/data'
  GEMINI_MODEL = 'gemini-3.6-flash'
  HOST = '0.0.0.0'
  OPENROUTER_MODEL = 'google/gemini-3.6-flash'
  PORT = '8787'
  PUBLIC_API_URL = 'https://www.agntiapro.com'
  TASK_WORKER_ENABLED = 'true'
  WORKSPACE_MODE = 'live'

[[mounts]]
  source = 'agntiapro_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

[checks]
  [checks.health]
    port = 8787
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
