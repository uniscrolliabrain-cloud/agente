name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (typecheck + test, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      # CI_TYPECHECK_SERVER_V1 — typecheck explícito del server.
      - run: pnpm typecheck
      - name: typecheck server (filter)
        if: hashFiles('apps/server/package.json') != ''
        run: pnpm --filter @openmuse/server exec tsc --noEmit
      - run: pnpm test
        env:
          ALLOW_NETWORK: "0"
      # CI_AUDITS_ENFORCED_V1 — antes los audits tenían `continue-on-error: true`,
      # así que un audit rojo no rompía el CI. Ahora sí lo rompe.
      - name: audits
        run: |
          pnpm audit:layers
          pnpm audit:bridges
          pnpm audit:console
          pnpm audit:tenant-default
          pnpm audit:idempotency
          pnpm audit:contracts

  # CI_WORKER_TYPECHECK_WARN_V1 — worker.ts sigue roto (Copilot lo repara en
  # otra rama). Este job es warn-only hasta que Copilot commitee el fix.
  worker:
    name: worker (typecheck)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: apps/worker
        run: npm ci
      - working-directory: apps/worker
        run: npm run typecheck

  web:
    name: web (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm --filter @openmuse/web exec tsc --noEmit
  integration:
    name: integration (network + Docker, main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          ALLOW_NETWORK: "1"
# CI_RELEASE_GATE_V1 - gate adicional antes de release.
  release-gate:
    name: release gate (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [unit, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec tsx scripts/release-check.ts
