name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (typecheck + test, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(pnpm store path)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: corepack pnpm install --frozen-lockfile
      # CI_TYPECHECK_SERVER_V1 — typecheck explícito del server.
      - run: pnpm typecheck
      - name: typecheck server (filter)
        if: hashFiles('apps/server/package.json') != ''
        run: pnpm exec tsc --noEmit
      - run: pnpm test
        env:
          ALLOW_NETWORK: "0"
      # CI_AUDITS_ENFORCED_V1 — antes los audits tenían `continue-on-error: true`,
      # así que un audit rojo no rompía el CI. Ahora sí lo rompe.
      - name: audits
        run: |
          pnpm audit:layers
          pnpm audit:bridges
          pnpm audit:anchors
          pnpm audit:console
          pnpm audit:tenant-default
          pnpm audit:idempotency
          pnpm audit:contracts
      # VERTICAL_SLICE_SMOKE_V1 - arranque real y HTTP autenticado sin
      # proveedores. No sustituye al gate: typecheck y suite ya corrieron arriba,
      # asi que aqui solo se ejecuta el smoke.
      - name: vertical slice smoke
        run: pnpm verify:slice --only smoke

    # Use the frozen workspace install for worker dependencies.
  worker:
    name: worker (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(pnpm store path)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm --filter @agente/browser-worker --fail-if-no-match typecheck

  web:
    name: web (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(pnpm store path)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm --filter @agente/web exec tsc --noEmit
  integration:
    name: integration (network + Docker, main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(pnpm store path)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          ALLOW_NETWORK: "1"
# CI_RELEASE_GATE_V1 - gate adicional antes de release.
  release-gate:
    name: release gate (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [unit, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(pnpm store path)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec tsx scripts/release-check.ts
