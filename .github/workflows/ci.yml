name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (typecheck + test, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          ALLOW_NETWORK: "0"
      - name: audits
        run: |
          pnpm audit:tenant-default
          pnpm audit:idempotency
          pnpm audit:contracts
        continue-on-error: true

  worker:
    name: worker (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: apps/worker
        run: npm ci
      - working-directory: apps/worker
        run: npm run typecheck

  web:
    name: web (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm --filter @openmuse/web exec tsc --noEmit
  integration:
    name: integration (network + Docker, main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          ALLOW_NETWORK: "1"
# CI_RELEASE_GATE_V1 - gate adicional antes de release.
  release-gate:
    name: release gate (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [unit, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec tsx scripts/release-check.ts
