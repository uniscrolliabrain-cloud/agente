name: Configurar base y desplegar (manual)

# CONFIGURE_PROD_DB_V2 - ruta manual pensada para lanzarse desde el movil.
# V1 instalaba el workspace con pnpm solo para tener el driver `pg`; el runner
# ya trae `psql`, asi que V2 valida el DSN sin node_modules (menos pasos, menos
# formas de fallar). Lee el DSN de Doppler, lo valida sin imprimirlo, lo fija
# en Fly, despliega si el health sigue en 503 y comprueba el login.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Aplicar en Fly si el DSN es valido"
        type: boolean
        default: true

concurrency:
  group: configure-prod-db
  cancel-in-progress: false

jobs:
  configure:
    name: configurar produccion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: instalar doppler y cliente de postgres
        run: |
          set -euo pipefail
          curl -sL https://cli.doppler.com/install.sh | sudo sh
          doppler --version
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: resolver DSN
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG || 'prd' }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT || 'agntiapro' }}
          S_SUPABASE: ${{ secrets.SUPABASE_DB_URL }}
          S_PROD: ${{ secrets.DATABASE_URL_PROD }}
          S_PLAIN: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pick() {
            echo "::add-mask::$1"
            { echo "DSN=$1"; echo "DSN_SOURCE=$2"; } >> "$GITHUB_ENV"
            echo "DSN tomado de: $2"
            exit 0
          }
          if [ -n "${DOPPLER_TOKEN:-}" ]; then
            echo "config de doppler: $DOPPLER_CONFIG"
            names=$(doppler secrets --only-names --json --config "$DOPPLER_CONFIG" 2>/tmp/dop.err \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const ks=Array.isArray(j)?j:Object.keys(j);console.log(ks.filter(k=>/DATABASE|SUPABASE|POSTGRES|PG_?URL/i.test(k)).join(" "))}catch{console.log("")}})' || true)
            if [ -s /tmp/dop.err ]; then echo "doppler dijo: $(head -c 200 /tmp/dop.err)"; fi
            echo "nombres relevantes en $DOPPLER_CONFIG: ${names:-ninguno}"
            project="${DOPPLER_PROJECT:-agntiapro}"
            configs="$DOPPLER_CONFIG"
            visibles=$(doppler configs --json --project "$project" 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.configs||[]);console.log(a.map(c=>c.name).filter(Boolean).join(" "))}catch{console.log("")}})' || true)
            echo "configs visibles con el token: ${visibles:-ninguno}"
            for c in $visibles prd production prod stg dev; do
              case " $configs " in *" $c "*) ;; *) configs="$configs $c" ;; esac
            done
            echo "configs a probar: $configs"
            for c in $configs; do
              for k in DATABASE_URL SUPABASE_DB_URL SUPABASE_DATABASE_URL SUPABASE_POOLER_URL POSTGRES_URL PG_URL; do
                v=$(doppler secrets get "$k" --plain --project "$project" --config "$c" 2>/dev/null || true)
                if [ -n "$v" ]; then pick "$v" "doppler:$c/$k"; fi
              done
            done
          else
            echo "sin DOPPLER_TOKEN en el repo: salto Doppler"
          fi
          if [ -n "${S_SUPABASE:-}" ]; then pick "$S_SUPABASE" "secret SUPABASE_DB_URL"; fi
          if [ -n "${S_PROD:-}" ]; then pick "$S_PROD" "secret DATABASE_URL_PROD"; fi
          if [ -n "${S_PLAIN:-}" ]; then pick "$S_PLAIN" "secret DATABASE_URL"; fi
          echo "::error::No hay DSN. Opcion rapida desde el movil: Settings -> Secrets and variables -> Actions -> New repository secret, nombre SUPABASE_DB_URL, valor el pooler de Supabase (puerto 6543)."
          exit 1

      - name: validar DSN
        run: |
          set -euo pipefail
          export PGSSLMODE=require PGCONNECT_TIMEOUT=15
          node -e 'const u=new URL(process.env.DSN);console.log(`host=${u.host} db=${u.pathname.slice(1)} user=${decodeURIComponent(u.username)}`)'
          if ! psql "$DSN" -t -A -c "select 1" > /dev/null 2> /tmp/psql.err; then
            echo "::error::psql no pudo conectar"
            cat /tmp/psql.err
            if grep -qiE "ENETUNREACH|Network is unreachable|No route to host" /tmp/psql.err; then
              echo "::error::Parece un DSN IPv6 directo (db.<ref>.supabase.co). Usa el pooler: puerto 6543 y host *.pooler.supabase.com."
            fi
            exit 1
          fi
          psql "$DSN" -t -A -c "select current_user || ' | ' || current_database() || ' | ' || split_part(version(), ',', 1)"
          vector=$(psql "$DSN" -t -A -c "select coalesce((select extversion from pg_extension where extname='vector'), '')" || true)
          bypass=$(psql "$DSN" -t -A -c "select rolbypassrls from pg_roles where rolname = current_user" || true)
          tablas=$(psql "$DSN" -t -A -c "select count(*) from information_schema.tables where table_schema='public'" || true)
          echo "pgvector=${vector:-no} rol_bypassrls=${bypass:-?} tablas_public=${tablas:-?}"
          if [ "$bypass" = "t" ]; then
            echo "::warning::El rol de la app tiene BYPASSRLS: las politicas de RLS se crearan pero no se aplicaran a este usuario."
          fi

      - name: aplicar en Fly
        if: ${{ inputs.apply }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          printf 'DATABASE_URL=%s\nMULTI_TENANT_SHARED=true\n' "$DSN" \
            | flyctl secrets import -a agntiapro-api
          printf 'DATABASE_URL=%s\nMULTI_TENANT_SHARED=true\n' "$DSN" \
            | flyctl secrets import -a agntiapro-worker \
            || echo "::warning::no se pudo actualizar agntiapro-worker (puede no existir o estar parada)"

      - name: esperar health y desplegar si hace falta
        if: ${{ inputs.apply }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          healthy=0
          for i in $(seq 1 24); do
            body=$(curl -sS --max-time 10 https://www.agntiapro.com/api/health || true)
            if echo "$body" | grep -q '"database":true'; then healthy=1; break; fi
            sleep 10
          done
          if [ "$healthy" != "1" ]; then
            echo "health sigue sin base tras 4 min; desplegando la imagen de main"
            flyctl deploy --remote-only -a agntiapro-api
            for i in $(seq 1 36); do
              body=$(curl -sS --max-time 10 https://www.agntiapro.com/api/health || true)
              if echo "$body" | grep -q '"database":true'; then healthy=1; break; fi
              sleep 10
            done
          fi
          echo "health_body=$body"
          curl -sS -o /dev/null -w "health_http=%{http_code}\n" https://www.agntiapro.com/api/health || true
          echo "login_github:"
          curl -sS -D- -o /dev/null https://www.agntiapro.com/api/auth/oauth/github/start \
            | awk 'BEGIN{IGNORECASE=1} /^location:/{print substr($0,1,110)}' || true
          if [ "$healthy" != "1" ]; then
            echo "::error::Produccion sigue sin base de datos. Revisa el DSN y los logs de Fly."
            exit 1
          fi
          echo "OK: base conectada y health en 200"
