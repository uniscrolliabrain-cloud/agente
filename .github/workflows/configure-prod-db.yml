name: Configurar base y desplegar (manual)

# CONFIGURE_PROD_DB_V3 - ruta manual pensada para lanzarse desde el movil.
# V1 instalaba el workspace con pnpm (corepack no verifica la firma de pnpm 11).
# V2 usaba ya `psql`, pero se quedaba con el primer DSN que encontraba: con el
# unico DSN en Doppler (Neon, cuota excedida) moria sin probar los demas.
# V3 reune TODOS los candidatos (secrets del repo primero, luego Doppler) y se
# queda con el primero que conecte de verdad.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Aplicar en Fly si hay un DSN que conecte"
        type: boolean
        default: true

concurrency:
  group: configure-prod-db
  cancel-in-progress: false

jobs:
  configure:
    name: configurar produccion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: instalar doppler y cliente de postgres
        run: |
          set -euo pipefail
          curl -sL https://cli.doppler.com/install.sh | sudo sh
          doppler --version
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: reunir candidatos de DSN
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG || 'prd' }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT || 'agntiapro' }}
          S_SUPABASE: ${{ secrets.SUPABASE_DB_URL }}
          S_PROD: ${{ secrets.DATABASE_URL_PROD }}
          S_PLAIN: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          : > dsn-candidates.txt
          add() {
            if [ -z "${1:-}" ]; then return 0; fi
            echo "::add-mask::$1"
            printf '%s\t%s\n' "$2" "$1" >> dsn-candidates.txt
            echo "candidato: $2"
          }
          add "${S_SUPABASE:-}" "secret SUPABASE_DB_URL"
          add "${S_PROD:-}" "secret DATABASE_URL_PROD"
          add "${S_PLAIN:-}" "secret DATABASE_URL"
          if [ -n "${DOPPLER_TOKEN:-}" ]; then
            project="${DOPPLER_PROJECT:-agntiapro}"
            visibles=$(doppler configs --json --project "$project" 2>/tmp/dop.err \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.configs||[]);console.log(a.map(c=>c.name).filter(Boolean).join(" "))}catch{console.log("")}})' || true)
            if [ -s /tmp/dop.err ]; then echo "doppler dijo: $(head -c 200 /tmp/dop.err)"; fi
            echo "configs visibles: ${visibles:-ninguno}"
            configs="${DOPPLER_CONFIG:-prd}"
            for c in $visibles prd production prod stg dev; do
              case " $configs " in *" $c "*) ;; *) configs="$configs $c" ;; esac
            done
            for c in $configs; do
              for k in DATABASE_URL SUPABASE_DB_URL SUPABASE_DATABASE_URL SUPABASE_POOLER_URL POSTGRES_URL PG_URL; do
                v=$(doppler secrets get "$k" --plain --project "$project" --config "$c" 2>/dev/null || true)
                if [ -n "$v" ]; then add "$v" "doppler:$c/$k"; fi
              done
            done
          else
            echo "sin DOPPLER_TOKEN en el repo: salto Doppler"
          fi
          echo "total candidatos: $(wc -l < dsn-candidates.txt)"
          if [ ! -s dsn-candidates.txt ]; then
            echo "::error::No hay ningun DSN. Anade el secret SUPABASE_DB_URL con el pooler (puerto 6543) o ponlo en Doppler."
            exit 1
          fi

      - name: validar DSN (usa el primero que conecta)
        run: |
          set -euo pipefail
          export PGSSLMODE=require PGCONNECT_TIMEOUT=15
          ok=""
          src=""
          while IFS=$'\t' read -r s d; do
            if [ -z "$d" ]; then continue; fi
            host=$(D="$d" node -e 'const u=new URL(process.env.D);console.log(u.host+" db="+u.pathname.slice(1)+" user="+decodeURIComponent(u.username))')
            if psql "$d" -t -A -c "select 1" > /dev/null 2> /tmp/psql.err; then
              ok="$d"
              src="$s"
              echo "conecta: $s ($host)"
              break
            else
              echo "no conecta: $s ($host)"
              sed -n '1,4p' /tmp/psql.err
            fi
          done < dsn-candidates.txt
          if [ -z "$ok" ]; then
            echo "::error::Ningun DSN candidato conecta."
            echo "::error::Si el de Neon sigue con la cuota excedida, usa el pooler de Supabase: postgresql://postgres.<ref>:<pass>@aws-<n>-<region>.pooler.supabase.com:6543/postgres"
            exit 1
          fi
          echo "::add-mask::$ok"
          { echo "DSN=$ok"; echo "DSN_SOURCE=$src"; } >> "$GITHUB_ENV"
          psql "$ok" -t -A -c "select current_user || ' | ' || current_database() || ' | ' || split_part(version(), ',', 1)"
          vector=$(psql "$ok" -t -A -c "select coalesce((select extversion from pg_extension where extname='vector'), '')" || true)
          bypass=$(psql "$ok" -t -A -c "select rolbypassrls from pg_roles where rolname = current_user" || true)
          tablas=$(psql "$ok" -t -A -c "select count(*) from information_schema.tables where table_schema='public'" || true)
          echo "pgvector=${vector:-no} rol_bypassrls=${bypass:-?} tablas_public=${tablas:-?}"
          if [ "$bypass" = "t" ]; then
            echo "::warning::El rol de la app tiene BYPASSRLS: las politicas de RLS se crearan pero no se aplicaran a este usuario."
          fi

      - name: aplicar en Fly
        if: ${{ inputs.apply }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          printf 'DATABASE_URL=%s\nMULTI_TENANT_SHARED=true\n' "$DSN" \
            | flyctl secrets import -a agntiapro-api
          printf 'DATABASE_URL=%s\nMULTI_TENANT_SHARED=true\n' "$DSN" \
            | flyctl secrets import -a agntiapro-worker \
            || echo "::warning::no se pudo actualizar agntiapro-worker (puede no existir o estar parada)"

      - name: esperar health y desplegar si hace falta
        if: ${{ inputs.apply }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          healthy=0
          for i in $(seq 1 24); do
            body=$(curl -sS --max-time 10 https://www.agntiapro.com/api/health || true)
            if echo "$body" | grep -q '"database":true'; then healthy=1; break; fi
            sleep 10
          done
          if [ "$healthy" != "1" ]; then
            echo "health sigue sin base tras 4 min; desplegando la imagen de main"
            flyctl deploy --remote-only -a agntiapro-api
            for i in $(seq 1 36); do
              body=$(curl -sS --max-time 10 https://www.agntiapro.com/api/health || true)
              if echo "$body" | grep -q '"database":true'; then healthy=1; break; fi
              sleep 10
            done
          fi
          echo "health_body=$body"
          curl -sS -o /dev/null -w "health_http=%{http_code}\n" https://www.agntiapro.com/api/health || true
          echo "login_github:"
          curl -sS -D- -o /dev/null https://www.agntiapro.com/api/auth/oauth/github/start \
            | awk 'BEGIN{IGNORECASE=1} /^location:/{print substr($0,1,110)}' || true
          if [ "$healthy" != "1" ]; then
            echo "::error::Produccion sigue sin base de datos. Revisa el DSN y los logs de Fly."
            exit 1
          fi
          echo "OK: base conectada y health en 200"
