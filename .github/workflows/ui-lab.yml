name: UI Lab - build and optional deploy
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the dedicated UI Lab Vercel project?"
        type: boolean
        default: false
        required: true
      browser_qa:
        description: "Run the versioned Login V3 browser QA (Playwright)?"
        type: boolean
        default: false
        required: false
  push:
    branches:
      - feat/ui-lab-main-isolated
      - fix/ui-lab-centro-tailwind-landing-studio
      - main
      - feat/comunicaciones-telefono-v1
      - feat/ui-lab-comunicaciones-whatsapp
      - fix/ui-lab-synthetic-all-previews
    paths:
      - "apps/ui-lab/**"
      - "apps/web/src/**"
      - "packages/domain/src/**"
      - "apps/web/public/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ui-lab.yml"
# Versión fijada a propósito: la QA de Login V3 debe repetirse con el mismo
# Playwright y, por tanto, con la misma revisión de Chromium.
env:
  PLAYWRIGHT_VERSION: "1.65.1"
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ui-lab-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck UI Lab
        run: pnpm --filter @agente/ui-lab typecheck
      - name: Build UI Lab
        env:
          UI_LAB_BUILD_SHA: ${{ github.sha }}
        run: pnpm --filter @agente/ui-lab build
      - name: Detect Login V3 view in this branch
        id: login_v3
        run: |
          set -euo pipefail
          # Nunca falla: informa si la vista existe para que el resto de pasos
          # de Login se omitan en ramas que no la incluyen.
          present=false
          if [ -f apps/ui-lab/src/registry.tsx ] &&
             grep -q 'id:"login-v3"' apps/ui-lab/src/registry.tsx &&
             [ -f apps/ui-lab/scripts/qa-login-v3.mjs ]; then
            present=true
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "Login V3 present in $GITHUB_REF: $present"
      - uses: actions/upload-artifact@v4
        with:
          name: agntiapro-ui-lab-dist
          path: apps/ui-lab/dist
          retention-days: 7
      - name: Prepare Formación V4 Chromebook package
        run: |
          set -euo pipefail
          mkdir -p /tmp/formacion-v4-chromebook/site
          cp -a apps/ui-lab/dist/. /tmp/formacion-v4-chromebook/site/
          cat > /tmp/formacion-v4-chromebook/INSTRUCCIONES.txt <<'EOF'
          AGNTIAPRO — FORMACIÓN V4 (12 fotografías)
          
          1. Descomprime el ZIP.
          2. Abre una terminal Linux en la carpeta descomprimida.
          3. Ejecuta: bash iniciar.sh
          4. Abre: http://localhost:8080/?view=formation-v4
          
          No necesitas clonar el repositorio ni instalar Node o pnpm.
          Solo necesitas Python 3 en el entorno Linux de Chromebook.
          Para detener el servidor pulsa Ctrl+C.
          La carpeta site/ contiene el UI Lab compilado completo,
          porque Formación comparte recursos de JavaScript y CSS.
          Este paquete funciona sin Vercel y no requiere conexión a Internet
          para servir los archivos locales; algunas fuentes externas pueden
          necesitar conexión.
          EOF
          printf '#!/usr/bin/env bash\nset -e\ncd "$(dirname "$0")/site"\necho "Abre http://localhost:8080/?view=formation-v4"\npython3 -m http.server 8080\n' > /tmp/formacion-v4-chromebook/iniciar.sh
          chmod +x /tmp/formacion-v4-chromebook/iniciar.sh
          test -f /tmp/formacion-v4-chromebook/site/formation/images/formacion-12-futuro.webp
      - uses: actions/upload-artifact@v4
        with:
          name: formacion-v4-chromebook
          path: /tmp/formacion-v4-chromebook/
          retention-days: 7
      - name: Browser QA Login V3 (opt-in)
        id: login_v3_qa
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_qa == true && steps.login_v3.outputs.present == 'true' }}
        env:
          UI_LAB_BUILD_SHA: ${{ github.sha }}
          SHOT_DIR: /tmp/login-v3-qa/capturas-ci
          REPORT: /tmp/login-v3-qa/qa-report.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/login-v3-qa
          {
            echo "runner: $(uname -a)"
            node --version
            echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION"
          } | tee /tmp/login-v3-qa/entorno.log
          npm i --prefix /tmp/pw --no-audit --no-fund --no-save "playwright@${PLAYWRIGHT_VERSION}" 2>&1 | tee /tmp/login-v3-qa/npm.log
          INSTALLED="$(node -p "require('/tmp/pw/node_modules/playwright/package.json').version")"
          test "$INSTALLED" = "$PLAYWRIGHT_VERSION"
          echo "Playwright $INSTALLED"
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium 2>&1 | tail -20
          # vite preview sirve el dist con Node (cola de conexiones amplia);
          # el http.server de Python se queda sin backlog cuando Chromium pide
          # el CSS de un chunk dinámico en paralelo y la vista no monta.
          nohup pnpm --filter @agente/ui-lab exec vite preview --host 127.0.0.1 --port 4173 --strictPort \
            > /tmp/login-v3-qa/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/version.json >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/version.json
          NODE_PATH=/tmp/pw/node_modules \
            PLAYWRIGHT_VERSION="$PLAYWRIGHT_VERSION" \
            EXPECTED_BUILD_SHA="$UI_LAB_BUILD_SHA" \
            node apps/ui-lab/scripts/qa-login-v3.mjs 2>&1 | tee /tmp/login-v3-qa/qa.log
      - name: Upload Login V3 QA evidence
        # Se sube también si la QA falla: sin log no hay forma de corregirla.
        if: ${{ always() && steps.login_v3.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.browser_qa == true }}
        uses: actions/upload-artifact@v4
        with:
          name: login-v3-qa-evidence
          path: /tmp/login-v3-qa/
          retention-days: 7
          if-no-files-found: warn
      - name: Prepare Login V3 Chromebook package
        # Omitido (no fallido) en ramas sin la vista: el job build sigue verde.
        if: ${{ steps.login_v3.outputs.present == 'true' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/login-v3-chromebook
          mkdir -p /tmp/login-v3-chromebook/site
          cp -a apps/ui-lab/dist/. /tmp/login-v3-chromebook/site/
          cat > /tmp/login-v3-chromebook/INSTRUCCIONES.txt <<'EOF'
          AGNTIAPRO — LOGIN V3 (prototipo UI Lab)
          
          1. Descomprime el ZIP.
          2. Abre una terminal Linux en la carpeta descomprimida.
          3. Ejecuta: bash iniciar.sh
          4. Abre: http://localhost:8080/?embed=1&view=login-v3
          
          Alternativa con selector del laboratorio: http://localhost:8080/?view=login-v3
          
          No necesitas clonar el repositorio ni instalar Node o pnpm.
          Solo necesitas Python 3 en el entorno Linux de Chromebook.
          Para detener el servidor pulsa Ctrl+C.
          La carpeta site/ contiene el UI Lab compilado completo.
          Este paquete funciona sin Vercel. No hay OAuth, autenticación,
          chat ni invitaciones conectados: los estados lo indican.
          Las fuentes Fraunces y Manrope viajan dentro de site/assets, con
          licencia OFL, así que el diseño se ve igual sin conexión a Internet.
          QA.md recoge lo comprobado y capturas/ las pruebas visuales.
          qa/qa-login-v3.mjs reproduce la QA de navegador con Playwright;
          qa/qa-report.json y capturas-ci/ solo aparecen si esta ejecución
          activó browser_qa, y llevan el SHA de build de este artifact.
          EOF
          printf '#!/usr/bin/env bash\nset -e\ncd "$(dirname "$0")/site"\necho "Abre http://localhost:8080/?embed=1&view=login-v3"\npython3 -m http.server 8080 --bind 127.0.0.1\n' > /tmp/login-v3-chromebook/iniciar.sh
          chmod +x /tmp/login-v3-chromebook/iniciar.sh
          test -f /tmp/login-v3-chromebook/site/index.html
          test -f /tmp/login-v3-chromebook/site/version.json
          grep -q 'id="root"' /tmp/login-v3-chromebook/site/index.html
          test -f /tmp/login-v3-chromebook/site/assets/$(cd apps/ui-lab/dist && ls assets | grep -m1 '^fraunces-latin-.*\.woff2$')
          test -f /tmp/login-v3-chromebook/site/assets/$(cd apps/ui-lab/dist && ls assets | grep -m1 '^manrope-latin-.*\.woff2$')
          cp apps/ui-lab/docs/dashboards/02-login/QA.md /tmp/login-v3-chromebook/QA.md
          cp apps/ui-lab/docs/dashboards/02-login/BITACORA-EJECUCION.md /tmp/login-v3-chromebook/BITACORA-EJECUCION.md
          mkdir -p /tmp/login-v3-chromebook/capturas /tmp/login-v3-chromebook/qa
          cp apps/ui-lab/docs/dashboards/02-login/capturas/login-v3-*.png /tmp/login-v3-chromebook/capturas/
          cp apps/ui-lab/scripts/qa-login-v3.mjs /tmp/login-v3-chromebook/qa/
          if [ -f /tmp/login-v3-qa/qa-report.json ]; then
            cp /tmp/login-v3-qa/qa-report.json /tmp/login-v3-chromebook/qa/qa-report.json
          fi
          if [ -d /tmp/login-v3-qa/capturas-ci ]; then
            mkdir -p /tmp/login-v3-chromebook/capturas-ci
            cp /tmp/login-v3-qa/capturas-ci/*.png /tmp/login-v3-chromebook/capturas-ci/ 2>/dev/null || true
          fi
          # El paquete declara con qué build se generó y con qué Playwright se probó.
          node -e '
            const fs=require("node:fs");
            const site=JSON.parse(fs.readFileSync("/tmp/login-v3-chromebook/site/version.json","utf8"));
            const reportPath="/tmp/login-v3-chromebook/qa/qa-report.json";
            const report=fs.existsSync(reportPath)?JSON.parse(fs.readFileSync(reportPath,"utf8")):null;
            fs.writeFileSync("/tmp/login-v3-chromebook/VERSION.txt",[`build: ${site.version}`,`builtAt: ${site.builtAt}`,`playwright: ${process.env.PLAYWRIGHT_VERSION}`,`browserQa: ${report?`${report.passed}/${report.total} checks in ${report.runId||"esta ejecución"}`:"omitida (browser_qa=false)"}`,``].join("\n"));
          '
          test -f /tmp/login-v3-chromebook/QA.md
          test $(ls /tmp/login-v3-chromebook/capturas | wc -l) -ge 6
      - uses: actions/upload-artifact@v4
        if: ${{ steps.login_v3.outputs.present == 'true' }}
        with:
          name: login-v3-chromebook
          path: /tmp/login-v3-chromebook/
          retention-days: 7
          if-no-files-found: error
      - name: Prepare Apps Launcher V3 Chromebook package
        run: |
          set -euo pipefail
          PKG=/tmp/apps-launcher-v3-chromebook
          mkdir -p "$PKG/site" "$PKG/iconos" "$PKG/capturas" "$PKG/documentacion"
          cp -a apps/ui-lab/dist/. "$PKG/site/"
          cp -a apps/ui-lab/docs/dashboards/11-apps/iconos/final/webp/. "$PKG/iconos/"
          cp -a apps/ui-lab/docs/dashboards/11-apps/qa/capturas/. "$PKG/capturas/"
          cp apps/ui-lab/docs/dashboards/11-apps/campana-launcher-v3/08-QA.md "$PKG/documentacion/"
          cp apps/ui-lab/docs/dashboards/11-apps/campana-launcher-v3/09-HANDOFF.md "$PKG/documentacion/"
          cp apps/ui-lab/docs/dashboards/11-apps/campana-launcher-v3/06-GENERACION-ICONOS.md "$PKG/documentacion/"
          cp apps/ui-lab/docs/dashboards/11-apps/iconos/final/manifiesto.json "$PKG/documentacion/manifiesto-iconos.json"
          cat > "$PKG/INSTRUCCIONES.md" <<'EOF'
          AGNTIAPRO — APPS LAUNCHER V3

          1. Descomprime el ZIP.
          2. Abre el terminal Linux en la carpeta descomprimida.
          3. Ejecuta: bash iniciar.sh
          4. Abre: http://localhost:4180/?embed=1&view=apps-launcher-v3

          Solo necesitas Python 3. El ZIP funciona sin red: los 35 iconos van dentro del build.
          Los datos son sintéticos; las apps abren una superficie de demostración.
          EOF
          printf '#!/usr/bin/env bash\nset -e\ncd "$(dirname "$0")"\necho "Abre http://localhost:4180/?embed=1&view=apps-launcher-v3"\npython3 -m http.server 4180 --directory site\n' > "$PKG/iniciar.sh"
          chmod +x "$PKG/iniciar.sh"
          test -f "$PKG/site/index.html"
          test "$(ls "$PKG/iconos" | wc -l)" -eq 35
      - uses: actions/upload-artifact@v4
        with:
          name: apps-launcher-v3-chromebook
          path: /tmp/apps-launcher-v3-chromebook/
          retention-days: 7
  deploy:
    needs: build
    concurrency:
      group: ui-lab-deploy
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    environment: ui-lab
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --no-frozen-lockfile
      - name: Validate dedicated project secrets
        env:
          TOKEN: ${{ secrets.UI_LAB_VERCEL_TOKEN }}
          ORG: ${{ secrets.UI_LAB_VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.UI_LAB_VERCEL_PROJECT_ID }}
        run: |
          test -n "$TOKEN" && test -n "$ORG" && test -n "$PROJECT" || { echo "UI Lab Vercel secrets missing"; exit 1; }
      - name: Refuse deployment from non-main branch
        run: test "$GITHUB_REF" = "refs/heads/main" || { echo "UI Lab deploy requires main"; exit 1; }
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull isolated UI Lab project settings
        working-directory: apps/ui-lab
        env:
          VERCEL_TOKEN: ${{ secrets.UI_LAB_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.UI_LAB_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.UI_LAB_VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build via Vercel
        working-directory: apps/ui-lab
        env:
          UI_LAB_BUILD_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.UI_LAB_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.UI_LAB_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.UI_LAB_VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy UI Lab only
        # Vercel project Root Directory is apps/ui-lab. Deploy from the repository
        # root so the CLI does not resolve apps/ui-lab/apps/ui-lab.
        env:
          VERCEL_TOKEN: ${{ secrets.UI_LAB_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.UI_LAB_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.UI_LAB_VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cp apps/ui-lab/.vercel/project.json .vercel/project.json
          cp -R apps/ui-lab/.vercel/output .vercel/output
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee /tmp/ui-lab-deployment-url.txt
          test -s /tmp/ui-lab-deployment-url.txt
      - name: Verify published UI Lab manifest and required previews
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL="$(tail -n 1 /tmp/ui-lab-deployment-url.txt | tr -d '\\r')"
          echo "Published URL: $URL"
          curl --fail --location --retry 5 --retry-delay 3 "$URL/version.json" -o /tmp/ui-lab-version.json
          node -e 'const v=require("/tmp/ui-lab-version.json");if(v.version!==process.env.EXPECTED_SHA){console.error("Stale deployment",v.version);process.exit(1)}'
          for view in full-app projects team users control operations comunicaciones formation formation-v4; do
            curl --fail --location --retry 3 "$URL/?embed=1&view=$view" -o /tmp/ui-lab-preview.html
            grep -q 'id="root"' /tmp/ui-lab-preview.html
          done
          for image in formacion-01-pensamiento formacion-02-cognicion formacion-03-lenguaje formacion-04-espacio-trabajo formacion-05-agenda formacion-06-equipo formacion-07-datos formacion-08-automatizacion formacion-09-comunicacion formacion-10-creatividad formacion-11-decisiones formacion-12-futuro; do
            curl --fail --location --retry 3 --silent --show-error "$URL/formation/images/$image.webp" -o /dev/null
          done
          echo "UI Lab deployment manifest, previews and 12 Formation images verified"

