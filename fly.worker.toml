# FLY_WORKER_TOML_V1 - worker de tareas durables, sin HTTP publico.
#
# Se despliega desde el mismo Dockerfile que el API (el entrypoint cambia con
# AGENTE_PROCESS_ROLE). No lleva [http_service]: no atiende trafico, se vigila
# por logs y por /api/health-deep del API.
#
#   fly deploy -c fly.worker.toml -a agntiapro-worker
app = "agntiapro-worker"
# FLY_REGION_FRA_V1 - misma region que el API para que worker y maquina
# compartan red y residencia de datos (ver fly.toml).
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKSPACE_MODE = "live"
  AGENT_BACKEND = "model"
  AGENTE_PROCESS_ROLE = "worker"
  DATA_DIR = "/data"
  # AGENTE_CLIENTS_DIR_V1 - mismo directorio que el API (ver fly.toml).
  AGENTE_CLIENTS_DIR = "/data/clientes"
  TASK_WORKER_ENABLED = "true"
  COMPUTER_ENABLED = "false"
  BACKUP_INTERVAL_HOURS = "24"
  BACKUP_RETENTION_DAYS = "7"

# Sin volumen: con DATABASE_URL no hay PGlite local que conservar. Los backups
# los hace el worker del API sobre Postgres (BACKUP_INTERVAL_HOURS).

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# FLY_WORKER_NO_HEALTHCHECK_V1 - Fly solo admite checks `http` o `tcp`; el
# `type = "script"` anterior hacia fallar `flyctl deploy` con "Missing or invalid
# check type", asi que el worker nunca llegaba a desplegarse. El rol worker no
# abre puerto, luego no hay check posible: se vigila por logs (flyctl logs -a
# agntiapro-worker) y por /api/health-deep del API, que reporta `worker: true`.
