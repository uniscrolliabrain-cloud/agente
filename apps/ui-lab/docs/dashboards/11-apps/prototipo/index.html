<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgntiaPro · Apps demo</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf6;color:#242421;font:15px Manrope,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #6550dd;outline-offset:4px}#os{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 75% 15%,#eae3fa,transparent 50%),radial-gradient(ellipse at 10% 90%,#e9dfcd,transparent 55%),#fcfaf6}header,nav{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(18px,5vw,72px);gap:12px}header small{color:#6e6c66}main{flex:1;width:min(1100px,100%);margin:auto;padding:24px clamp(16px,4vw,48px)}h1{font:400 clamp(36px,6vw,72px) Fraunces,Georgia,serif;letter-spacing:-.05em;margin:0 0 12px}p{color:#6e6c66}button{border:0;background:transparent} .pill{background:#fff9;border:1px solid #e6e1d8;border-radius:24px;padding:12px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:24px 12px;margin:32px 0}.app{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:13px;min-width:0}.tile{display:grid;place-items:center;width:70px;height:70px;border-radius:23px;background:linear-gradient(145deg,#fff,#e8e0f5);border:1px solid #fff;box-shadow:0 5px 12px #34275114,inset 0 -3px 5px #6550dd10;color:#6550dd;font-size:32px;transition:transform .2s}.app:nth-child(3n) .tile{background:linear-gradient(145deg,#fff,#e9ddc6);color:#856b40}.app:hover .tile{transform:translateY(-4px)}input{width:100%;padding:16px 22px;border:1px solid #e6e1d8;border-radius:28px;background:#fffc;color:inherit}.rest{text-align:center;padding:12vh 0}.clock{font:400 clamp(80px,15vw,150px) Fraunces,Georgia,serif;letter-spacing:-.07em}.dock{margin:0 auto 20px;display:flex;gap:12px;justify-content:center;background:#fff8;border:1px solid #fff;border-radius:32px;padding:12px;max-width:95%;flex-wrap:wrap}.dock button{padding:10px 15px;border-radius:20px}.dock button:hover{background:#f0ecfc}.panel{background:#fffd;border:1px solid #e6e1d8;border-radius:28px;padding:32px}.scene{animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 4px}.tile{width:58px;height:58px;border-radius:19px;font-size:27px}.app{font-size:11px}header,nav{padding:16px}.dock{gap:2px}.dock button{padding:10px}.panel{padding:20px}}@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}</style><div id="os"><header><strong>AgntiaPro</strong><small>Mi empresa · Demo</small><button class="pill" id="rest">Reposo</button></header><main id="view"></main><div class="dock"><button data-go="home">Inicio</button><button data-go="all">Todas las apps</button><button data-go="recent">Recientes</button><button data-go="laia">✦ LAIA</button></div></div><script>const apps=[{"id":"01-gmail","name":"Correo","glyph":"✉"},{"id":"02-whatsapp","name":"Conversaciones","glyph":"◉"},{"id":"03-hubspot","name":"Clientes","glyph":"◎"},{"id":"04-holded","name":"Facturación","glyph":"▤"},{"id":"05-google-drive","name":"Archivos","glyph":"▱"},{"id":"06-google-calendar","name":"Agenda","glyph":"▦"},{"id":"07-linear","name":"Plan de trabajo","glyph":"✓"},{"id":"08-chatgpt","name":"Asistente","glyph":"✦"},{"id":"09-airtable","name":"Registros","glyph":"▥"},{"id":"10-perdoo","name":"Objetivos","glyph":"◈"},{"id":"11-holded-tesoreria","name":"Tesorería","glyph":"€"},{"id":"12-odoo-purchase","name":"Compras","glyph":"◇"},{"id":"13-productive","name":"Rentabilidad","glyph":"↗"},{"id":"14-zendesk","name":"Atención","glyph":"☏"},{"id":"15-docusign","name":"Firmas","glyph":"✎"},{"id":"16-n8n","name":"Automatizaciones","glyph":"⌘"},{"id":"17-process-street","name":"Procedimientos","glyph":"☷"},{"id":"18-factorial","name":"Equipo","glyph":"♙"},{"id":"19-personio","name":"Personas","glyph":"♧"},{"id":"20-ramp","name":"Gastos","glyph":"−"},{"id":"21-stripe","name":"Cobros","glyph":"+"},{"id":"22-canva","name":"Diseño","glyph":"◒"},{"id":"23-buffer","name":"Publicaciones","glyph":"≋"},{"id":"24-shopify","name":"Tienda","glyph":"▣"},{"id":"25-intercom","name":"Soporte","glyph":"◌"},{"id":"26-odoo-inventory","name":"Inventario","glyph":"▧"},{"id":"27-maintainx","name":"Mantenimiento","glyph":"⚙"},{"id":"28-odoo-manufacturing","name":"Producción","glyph":"⬡"},{"id":"29-isms-online","name":"Cumplimiento","glyph":"◆"},{"id":"30-microsoft-entra","name":"Accesos","glyph":"⚿"},{"id":"31-suitedash","name":"Portal cliente","glyph":"▰"},{"id":"32-notion","name":"Conocimiento","glyph":"▩"},{"id":"33-langsmith","name":"Observabilidad IA","glyph":"∿"},{"id":"34-trello","name":"Tableros","glyph":"▥"},{"id":"35-centro-mando","name":"Centro de Mando","glyph":"◫"}];let screen="rest",recent=[],favorites=apps.slice(0,8).map(a=>a.id),active=null;const view=document.querySelector("#view");const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function tiles(list){return '<div class="grid">'+list.map(a=>'<button class="app" data-app="'+a.id+'"><span class="tile" aria-hidden="true">'+a.glyph+'</span><span>'+esc(a.name)+'</span></button>').join("")+'</div>'}function render(){view.className="";if(screen==="rest"){view.innerHTML='<section class="rest scene"><div class="clock">'+new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})+'</div><p>'+new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})+'</p><h1>Tu empresa, contigo.</h1><p>Todo conectado. Contigo al mando.</p><button class="pill" data-go="home">Abrir mi empresa</button></section>'}else if(screen==="home"){view.innerHTML='<section class="scene"><p>TU EMPRESA. UN EQUIPO DIGITAL.</p><h1>Tu empresa, en movimiento.</h1><p>Tú marcas el rumbo. Tu equipo te acompaña.</p><button class="pill" data-go="all">Buscar una aplicación</button>'+tiles(apps.filter(a=>favorites.includes(a.id)))+'</section>'}else if(screen==="all"){view.innerHTML='<section class="scene"><h1>Tus aplicaciones.</h1><input id="search" aria-label="Buscar aplicaciones" placeholder="¿Con qué quieres trabajar?" autocomplete="off"><div id="results">'+tiles(apps)+'</div></section>';document.querySelector("#search").oninput=e=>{const q=e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");const list=apps.filter(a=>(a.name+" "+a.id).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(q));document.querySelector("#results").innerHTML=list.length?tiles(list):"<p>No encontramos esa aplicación.</p>"}}else if(screen==="recent"){view.innerHTML='<h1>Retoma tu trabajo.</h1>'+ (recent.length?tiles(recent.map(id=>apps.find(a=>a.id===id))):"<p>Todavía no has abierto ninguna aplicación.</p>")}else if(screen==="laia"){view.innerHTML='<section class="panel scene"><h1>Hola, soy LAIA.</h1><p>¿Qué te gustaría quitarte de encima en tu empresa?</p><p>Vista de demostración. No se ejecutan encargos reales.</p><button class="pill" data-go="home">Volver al escritorio</button></section>'}else{view.innerHTML='<section class="panel scene"><button class="pill" data-go="all">← Tus aplicaciones</button><h1>'+esc(active.name)+'</h1><p>Vista de demostración · Sin conexión real</p><p>Este acceso representa el workspace de tu empresa. Su interfaz específica se conserva para una fase posterior.</p><button class="pill" id="favorite">'+(favorites.includes(active.id)?"Quitar de favoritos":"Fijar en inicio")+'</button></section>';document.querySelector("#favorite").onclick=()=>{favorites=favorites.includes(active.id)?favorites.filter(id=>id!==active.id):[...favorites,active.id];render()}}}document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="rest"){screen="rest";render()}else if(b.dataset.go){screen=b.dataset.go;render()}else if(b.dataset.app){active=apps.find(a=>a.id===b.dataset.app);recent=[active.id,...recent.filter(id=>id!==active.id)];screen="app";render()}});document.addEventListener("keydown",e=>{if(e.key==="Escape"){screen="home";render()}});render();</script></html>
